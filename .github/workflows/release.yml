name: Pack and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Each .flexplugin must carry the native canvas build of *its own*
      # platform. A plain install on this runner only fetches the Linux binding,
      # which is how the first tagged build produced packages that silently lost
      # canvas rendering everywhere else - so pull the other platforms too.
      - name: Install platform canvas binaries
        run: |
          npm install --no-save \
            @napi-rs/canvas-darwin-arm64@^0.1.83 \
            @napi-rs/canvas-darwin-x64@^0.1.83 \
            @napi-rs/canvas-win32-x64-msvc@^0.1.83

      - name: Install FlexCLI
        run: npm install -g @eniac/flexcli

      - name: Build plugin
        run: npm run build

      - name: Pack the four platform packages
        run: node tools/make-platform-packages.js

      - name: Verify each package carries the right native library
        run: node tools/verify-platform-packages.js

      # Always keep the packages as workflow artifacts, so a manual run (or a
      # run whose release step is skipped) still leaves something downloadable.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexplugin-packages
          path: dist/*.flexplugin
          if-no-files-found: error

      # FlexGate reads the plugin metadata from this repository; the packed
      # .flexplugin files are published as release assets so users can download
      # the one that matches their machine.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flexplugin
