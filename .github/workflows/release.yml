name: Pack and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Each .flexplugin must carry the native canvas build of *its own*
      # platform. A plain install on this runner only fetches the Linux binding,
      # which is how the first tagged build produced packages that silently lost
      # canvas rendering everywhere else - so pull the other platforms too.
      # `npm install` refuses packages for a different os/cpu (EBADPLATFORM), so
      # fetch the tarballs and unpack them by hand, pinned to the canvas version
      # that is actually installed.
      - name: Install platform canvas binaries
        run: |
          set -euo pipefail
          CANVAS_VERSION=$(node -p "require('@napi-rs/canvas/package.json').version")
          echo "canvas version: $CANVAS_VERSION"
          mkdir -p node_modules/@napi-rs
          for pkg in canvas-darwin-arm64 canvas-darwin-x64 canvas-win32-x64-msvc; do
            tgz=$(npm pack "@napi-rs/$pkg@$CANVAS_VERSION" --pack-destination /tmp | tail -1)
            rm -rf "node_modules/@napi-rs/$pkg"
            mkdir -p "node_modules/@napi-rs/$pkg"
            tar -xzf "/tmp/$tgz" -C "node_modules/@napi-rs/$pkg" --strip-components=1
            echo "  + $pkg ($tgz)"
          done
          ls node_modules/@napi-rs

      - name: Install FlexCLI
        run: npm install -g @eniac/flexcli

      - name: Build plugin
        run: npm run build

      - name: Pack the four platform packages
        run: node tools/make-platform-packages.js

      - name: Verify each package carries the right native library
        run: node tools/verify-platform-packages.js

      # Always keep the packages as workflow artifacts, so a manual run (or a
      # run whose release step is skipped) still leaves something downloadable.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexplugin-packages
          path: dist/*.flexplugin
          if-no-files-found: error

      # FlexGate reads the plugin metadata from this repository; the packed
      # .flexplugin files are published as release assets so users can download
      # the one that matches their machine.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flexplugin
